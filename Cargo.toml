[package]
name = "joebro"
version = "1.0.2"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu", "wayland", "x11"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }
egui_commonmark = "0.18"
# TLS: rustls on Linux/macOS; Windows uses the OS stack (schannel) so the
# build needs no C compiler / MinGW to cross-compile.
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "multipart"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
base64 = "0.22"
dirs = "5"
getrandom = "0.2"
rfd = "0.15"
open = "5"
egui-phosphor = { version = "0.7", default-features = false, features = ["regular", "fill"] }
qrcode = { version = "0.15.0", default-features = false }

[target.'cfg(not(windows))'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

[target.'cfg(windows)'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["native-tls"] }

[features]
# `personal` = Joe's build (Pi backend, token file, desktop-glass look as
# defaults). The default (no feature) build is the generic production client.
personal = []
# Offscreen PNG renderer for visual checks (never in the shipped build).
snapshot = []

[profile.release]
opt-level = 2

[build-dependencies]
winresource = "0.1"
